<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><link rel="icon" href="data:,">
<title>무대 화면</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#0a0b10;--ink:#ffffff;--sub:rgba(255,255,255,.55);--lb:rgba(255,255,255,.5);--acc:#ff6b5a;--card:rgba(255,255,255,.07);--cardline:rgba(255,255,255,.1);--qrbg:#fff;--shadow:rgba(0,0,0,.35);
  --p1:#ff6b8a;--p2:#ffb547;--p3:#4fe3b0;--p4:#5cb4ff;--p5:#b58cff;--p6:#ff8f5c;--p7:#6ee7f0;--p8:rgba(255,255,255,.1)}
[data-theme="light"]{--bg:#f3eee4;--ink:#2a2724;--sub:#8a847a;--lb:rgba(42,39,36,.55);--acc:#e8623c;--card:transparent;--cardline:transparent;--shadow:rgba(60,40,20,.08);
  --p1:#f7cfb3;--p2:#f2a98b;--p3:#c9dcc0;--p4:#c4e3d6;--p5:#f6e3b4;--p6:#d8d0ef;--p7:#c9d8e6;--p8:#fbe6d4}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden;cursor:none;-webkit-font-smoothing:antialiased}
body.showcursor{cursor:default}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bg i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.32;mix-blend-mode:screen}
.bg i:nth-child(1){background:#4b2a6a;left:-20vmax;top:-25vmax;animation:d1 38s ease-in-out infinite alternate}
.bg i:nth-child(2){background:#1d3b63;right:-25vmax;bottom:-30vmax;animation:d2 46s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(12vw,10vh)}}@keyframes d2{to{transform:translate(-14vw,-8vh)}}
[data-theme="light"] .bg{display:none}
.page{z-index:1}
.c{cursor:pointer}.c:hover{transform:translateY(-.4vh);box-shadow:0 1vh 2.6vh rgba(60,40,20,.14)}.c{transition:transform .2s,box-shadow .2s}
.c.on{outline:.4vh solid var(--acc);outline-offset:.2vh}
.c:hover{box-shadow:0 1vh 2.6vh var(--shadow)}
body.paused .top,body.paused .feat,body.paused .wall{visibility:hidden}
.page{position:absolute;inset:0;padding:4.5vh 4vw 0;display:flex;flex-direction:column;gap:2.6vh}
/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;flex:none}
.brand .k{display:flex;align-items:center;gap:.8vh;font-size:1.5vh;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--acc)}
.brand .k::before{content:"";width:1.1vh;height:1.1vh;border-radius:50%;background:var(--acc)}
.brand .t{font-size:6.2vh;font-weight:800;letter-spacing:-.035em;line-height:1.08;margin-top:1.2vh}
.qr{display:flex;flex-direction:column;align-items:center;gap:.8vh;background:#fff;color:#111;border-radius:2vh;padding:1.4vh;box-shadow:0 1vh 3vh var(--shadow);flex:none}
.qr canvas{width:13vh;height:13vh;display:block;border-radius:.8vh}
.qr .u{font-size:1.4vh;font-weight:700;color:#444;text-align:center;line-height:1.3}
.qr .u small{display:block;font-weight:700;color:#111;font-size:1.5vh}
/* featured modal */
.feat{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:8vh 8vw;background:rgba(0,0,0,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0;pointer-events:none;transition:opacity .35s;cursor:pointer}
[data-theme="light"] .feat{background:rgba(243,238,228,.78)}
.feat.on{opacity:1;pointer-events:auto}
.feat .box{--p:var(--p1);position:relative;width:auto;min-width:46vw;max-width:min(86vw,170vh);max-height:84vh;background:var(--card);border:1px solid var(--cardline);border-radius:3.2vh;padding:5vh 5vw 4.5vh;box-shadow:0 3vh 10vh rgba(0,0,0,.5);overflow:hidden;animation:zoom .5s cubic-bezier(.2,1.1,.3,1) both}
[data-theme="light"] .box{background:#fff;box-shadow:0 3vh 8vh rgba(60,40,20,.2)}
.feat .box::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1vh;background:var(--p);box-shadow:0 0 4vh var(--p)}
.feat .lb{font-size:2vh;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--p);display:flex;gap:1.6vh;align-items:baseline}
.feat .lb span{color:var(--sub);letter-spacing:.02em;text-transform:none;font-size:2.2vh}
.feat .bd{margin-top:2.6vh;font-size:6.4vh;font-weight:700;line-height:1.3;letter-spacing:-.025em;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap}
.feat .bd.long{font-size:5vh}.feat .bd.xlong{font-size:4vh}
.feat .bd::before{content:"“ "}.feat .bd::after{content:" ”"}
.feat .hint{position:absolute;right:2.4vw;bottom:2.4vh;font-size:1.5vh;color:var(--sub);font-weight:600}
@keyframes zoom{from{transform:scale(.88) translateY(2vh);opacity:0}to{transform:none;opacity:1}}
.wall.dim{filter:blur(2px)}
/* masonry wall */
.wall{flex:1;min-height:0;columns:5;column-gap:1.2vw;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(to bottom,#000 88%,transparent 100%);mask-image:linear-gradient(to bottom,#000 88%,transparent 100%)}
.c{--p:var(--p1);position:relative;break-inside:avoid;display:inline-block;width:100%;margin:0 0 1.6vh;background:var(--card);border:1px solid var(--cardline);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:2vh;padding:2vh 2vh 1.8vh 2.6vh;box-shadow:0 .5vh 1.8vh var(--shadow);vertical-align:top;overflow:hidden}
.c::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.6vh;background:var(--p);box-shadow:0 0 2.4vh var(--p)}
[data-theme="light"] .c{background:var(--p);padding-left:2vh}[data-theme="light"] .c::before{display:none}
.c.p1{--p:var(--p1)}.c.p2{--p:var(--p2)}.c.p3{--p:var(--p3)}.c.p4{--p:var(--p4)}.c.p5{--p:var(--p5)}.c.p6{--p:var(--p6)}.c.p7{--p:var(--p7)}
.c .lb{font-size:1.25vh;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lb);display:flex;gap:.8vh;white-space:nowrap;overflow:hidden}
.c .lb span{letter-spacing:.02em;text-transform:none;overflow:hidden;text-overflow:ellipsis}
.c .bd{margin-top:1vh;font-size:2.5vh;font-weight:700;line-height:1.4;letter-spacing:-.015em;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap}
.c.s .bd{font-size:3.2vh}
.c .bd::before{content:"“"}.c .bd::after{content:"”"}
.c .nm{margin-top:1.2vh;font-size:1.5vh;font-weight:700;color:var(--p)}[data-theme="light"] .c .nm{color:rgba(42,39,36,.6)}
.c.in{animation:enter .55s cubic-bezier(.2,1.1,.3,1) both}
@keyframes enter{from{opacity:0;transform:translateY(-2vh) scale(.96)}to{opacity:1;transform:none}}
.c.out{animation:leave .3s ease-in both}
@keyframes leave{to{opacity:0;transform:scale(.94)}}
/* hold + empty */
.hold{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:5vh;z-index:4;text-align:center}
.hold.on{display:flex}
.hold .k{font-size:2vh;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--acc)}
.hold h1{font-size:7.5vh;margin:1.5vh 0 0;letter-spacing:-.035em;font-weight:800;line-height:1.1}
.hold .qr{padding:2.4vh}.hold .qr canvas{width:34vh;height:34vh}
.hold .qr .u{font-size:2.2vh}.hold .qr .u small{font-size:2.4vh}
.empty{position:absolute;left:0;right:0;top:55%;text-align:center;color:var(--sub);font-size:2.6vh;font-weight:600}
.empty b{display:block;font-size:5vh;color:var(--ink);margin-bottom:1vh;letter-spacing:-.03em}
.st{position:fixed;left:1vw;bottom:1vh;font-size:1.4vh;color:var(--lb);opacity:.5;z-index:5}
.st.bad{color:var(--acc)}
</style></head><body>
<div class="bg"><i></i><i></i></div>
<div class="page">
  <div class="top"><div class="brand"><div class="k">Live Text</div><div class="t" id="title"></div></div><div class="qr"><canvas id="qr1"></canvas><div class="u"><small>휴대폰으로 참여</small><span id="u1"></span></div></div></div>
  <div class="wall" id="wall"></div>
</div>
<div class="feat" id="feat"><div class="box" id="fbox"><div class="lb">Message #<b id="fseq"></b><span id="fn"></span></div><div class="bd" id="fb"></div><span class="hint">클릭하거나 Esc로 닫기</span></div></div>
<div class="empty" id="empty" hidden><b>첫 메시지를 기다리고 있어요</b>QR을 찍고 무대에 한마디 남겨주세요</div>
<div class="hold" id="hold"><div><div class="k">Live Text</div><h1 id="htitle"></h1></div><div class="qr"><canvas id="qr2"></canvas><div class="u"><small>휴대폰으로 참여</small><span id="u2"></span></div></div></div>
<div class="st" id="st"></div>
<script src="../vendor/supabase.js"></script><script src="../vendor/qrcode.js"></script><script src="../config.js"></script>
<script>
(function(){
  var theme = new URLSearchParams(location.search).get('theme'); if (theme === 'light') document.documentElement.setAttribute('data-theme','light');
  var sb = supabase.createClient(STAGE_CONFIG.url, STAGE_CONFIG.key);
  var $ = function(id){ return document.getElementById(id); };
  var MAX = 30;
  var localFeat = null; // 화면에서 직접 클릭한 카드
  var msgs = {}, order = [], settings = {moderation:true, paused:false, featured_id:null, title:''};
  var audienceUrl = location.origin + location.pathname.replace(/screen\/?(index\.html)?$/, '');
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function drawQR(canvasId, size){
    var q = qrcode(0, 'M'); q.addData(audienceUrl); q.make();
    var c = $(canvasId), n = q.getModuleCount(), cell = Math.max(2, Math.floor(size / n)); c.width = c.height = cell * n;
    var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.fillStyle = '#111';
    for (var r=0;r<n;r++) for (var col=0;col<n;col++) if (q.isDark(r,col)) ctx.fillRect(col*cell, r*cell, cell, cell);
  }
  var shown = audienceUrl.replace(/^https?:\/\//,'').replace(/\/$/,'');
  $('u1').textContent = shown; $('u2').textContent = shown;
  drawQR('qr1', 400); drawQR('qr2', 800);

  function pal(m){ var n = m.seq != null ? Number(m.seq) : 0; if (!n) { for (var i=0;i<m.id.length;i++) n = (n*31 + m.id.charCodeAt(i)) >>> 0; } return 'p' + (n % 7 + 1); }
  function seqOf(m){ return m.seq != null ? m.seq : '—'; }
  function cardEl(m){
    var el = document.createElement('div'); el.dataset.id = m.id; el.className = 'c ' + pal(m) + (m.body.length <= 10 ? ' s' : '');
    el.innerHTML = '<div class="lb">Message #' + esc(seqOf(m)) + (m.name ? '<span>' + esc(m.name) + '</span>' : '') + '</div><div class="bd">' + esc(m.body) + '</div>' + (m.name ? '<div class="nm">' + esc(m.name) + '</div>' : '');
    return el;
  }
  function sortedApproved(){
    return order.filter(function(id){ return msgs[id] && msgs[id].status === 'approved'; })
      .sort(function(a,b){ var A = msgs[a], B = msgs[b]; return (Number(B.seq||0) - Number(A.seq||0)) || (B.created_at > A.created_at ? 1 : -1); });
  }
  function renderWall(){
    var wall = $('wall');
    var keep = sortedApproved().slice(0, MAX);
    var cur = Array.prototype.slice.call(wall.children);
    var first = {}; cur.forEach(function(el){ first[el.dataset.id] = el.getBoundingClientRect(); });
    cur.forEach(function(el){ if (keep.indexOf(el.dataset.id) < 0) { el.classList.add('out'); setTimeout(function(){ el.remove(); }, 300); } });
    keep.forEach(function(id, i){
      var el = wall.querySelector('[data-id="'+id+'"]');
      if (!el) { el = cardEl(msgs[id]); el.classList.add('in'); }
      var ref = wall.children[i];
      if (ref !== el) wall.insertBefore(el, ref || null);
    });
    keep.forEach(function(id){
      var el = wall.querySelector('[data-id="'+id+'"]'), f = first[id]; if (!el || !f) return;
      var l = el.getBoundingClientRect(), dx = f.left - l.left, dy = f.top - l.top;
      if (!dx && !dy) return;
      el.style.transition = 'none'; el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      requestAnimationFrame(function(){ el.style.transition = 'transform .5s cubic-bezier(.2,1,.3,1)'; el.style.transform = ''; });
    });
    $('empty').hidden = keep.length > 0 || settings.paused;
  }
  function renderFeat(){
    if (dismissed && dismissed !== settings.featured_id) dismissed = null;
    var fid = localFeat || (settings.featured_id !== dismissed ? settings.featured_id : null);
    var m = fid && msgs[fid];
    if (localFeat && !(m && m.status === 'approved')) { localFeat = null; m = settings.featured_id && msgs[settings.featured_id]; fid = settings.featured_id; }
    var on = !!(m && m.status === 'approved' && !settings.paused);
    Array.prototype.forEach.call($('wall').children, function(el){ el.classList.toggle('on', on && el.dataset.id === fid); });
    if (on) {
      $('fbox').className = 'box ' + pal(m);
      $('fseq').textContent = seqOf(m); $('fn').textContent = m.name || '';
      $('fb').textContent = m.body; $('fb').className = 'bd ' + (m.body.length > 110 ? 'xlong' : m.body.length > 60 ? 'long' : '');
    }
    $('feat').classList.toggle('on', on); $('wall').classList.toggle('dim', on);
  }
  function renderSettings(){
    $('title').textContent = settings.title || '무대에 메시지를 보내주세요';
    $('htitle').textContent = settings.title || '무대에 메시지를 보내주세요';
    $('hold').classList.toggle('on', !!settings.paused);
    document.body.classList.toggle('paused', !!settings.paused);
    renderFeat(); renderWall();
  }
  function upsert(m){ if (!msgs[m.id]) order.push(m.id); msgs[m.id] = m; }
  function loadAll(){
    return Promise.all([
      sb.from('stage_settings').select('*').eq('id',1).single(),
      sb.from('stage_messages').select('id,seq,name,body,status,created_at').eq('status','approved').order('created_at',{ascending:false}).limit(MAX)
    ]).then(function(rs){
      if (!rs[0].error) settings = rs[0].data;
      if (!rs[1].error) { msgs = {}; order = []; rs[1].data.slice().reverse().forEach(upsert); }
      if (settings.featured_id && !msgs[settings.featured_id]) {
        return sb.from('stage_messages').select('id,seq,name,body,status,created_at').eq('id', settings.featured_id).single().then(function(r){ if (!r.error) upsert(r.data); renderSettings(); });
      }
      renderSettings();
    });
  }
  loadAll();
  sb.channel('screen')
    .on('postgres_changes',{event:'*',schema:'public',table:'stage_messages'},function(p){
      if (p.eventType === 'DELETE') { delete msgs[p.old.id]; order = order.filter(function(i){return i!==p.old.id;}); }
      else upsert(p.new);
      renderFeat(); renderWall();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'stage_settings'},function(p){ if (p.new) { settings = p.new; if (settings.featured_id && !msgs[settings.featured_id]) loadAll(); else renderSettings(); } })
    .subscribe(function(s){ var ok = s === 'SUBSCRIBED'; $('st').textContent = ok ? '' : '연결 중… (' + s + ')'; $('st').className = 'st' + (ok ? '' : ' bad'); if (ok) loadAll(); });
  setInterval(loadAll, 60000);
  // 카드 클릭 → 크게 보기(이 화면에서만). 배너 클릭/Esc → 닫기
  $('wall').addEventListener('click', function(e){ var c = e.target.closest('.c'); if (!c) return; localFeat = (localFeat === c.dataset.id) ? null : c.dataset.id; renderFeat(); });
  var dismissed = null;
  $('feat').addEventListener('click', function(){ localFeat = null; dismissed = settings.featured_id; renderFeat(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { localFeat = null; dismissed = settings.featured_id; renderFeat(); } });
  var hideT; document.addEventListener('mousemove', function(){ document.body.classList.add('showcursor'); clearTimeout(hideT); hideT = setTimeout(function(){ document.body.classList.remove('showcursor'); }, 2000); });
  document.addEventListener('keydown', function(e){ if (e.key === 'f' || e.key === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } });
})();
</script></body></html>
