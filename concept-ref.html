&lt;div class=&quot;kicker&quot;&gt;SLBS · PRSM Clear Line · iPhone 18 · v3 조임&lt;/div&gt;
&lt;h1&gt;PRSM 아이폰18 KV 컨셉 · 무드 디렉션&lt;/h1&gt;
&lt;p class=&quot;lead&quot;&gt;시그니처 셋을 &lt;b&gt;하나의 장치&lt;/b&gt;로 조입니다 — 뺄셈이 곧 각인입니다.&lt;/p&gt;
&lt;p class=&quot;meta&quot;&gt;근거: 메타 소재 지표 + 자사몰 실매출 MER · 창작 방향은 A/B 검증 전제 · 이미지 파일 내장(durable)&lt;/p&gt;

&lt;h2&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;왜 오리무중인가&lt;/h2&gt;
&lt;p class=&quot;sub2&quot;&gt;소재 퀄리티가 아니라 &quot;브랜드 얼굴&quot;이 없다 — 게다가 이름으로는 승자를 못 가린다.&lt;/p&gt;
&lt;div class=&quot;diag&quot;&gt;&lt;b&gt;PRSM 소재는 세 갈래로 흩어져 있습니다.&lt;/b&gt; ① 라이프스타일(CTR 터지고 전환 0 수렴) · ② 스튜디오 제품컷(실제 판매) · ③ 스타일 착용컷(끌리고 팔림). 셋이 &lt;b&gt;서로 다른 조명·색·구도&lt;/b&gt;라 &quot;PRSM다움&quot;으로 안 묶입니다.&lt;/div&gt;
&lt;div class=&quot;evi&quot;&gt;
 &lt;div class=&quot;iw&quot;&gt;&lt;img class=&quot;&quot; src=&quot;https://yhbduxezupwfmcemuokt.supabase.co/storage/v1/object/public/board-img/b0.jpg&quot; alt=&quot;&quot;&gt;&lt;/div&gt;
 &lt;div class=&quot;tx&quot;&gt;&lt;span class=&quot;tag&quot;&gt;이름 ≠ 이미지 · 결정적 증거&lt;/span&gt;&lt;br&gt;
 &lt;b&gt;이 한 장이 이름만 다르게 두 번 집행됐는데&lt;/b&gt; 메타상 한쪽 &lt;b&gt;ROAS 0.63&lt;/b&gt;, 다른 쪽 &lt;b&gt;1.86&lt;/b&gt;으로 정반대로 찍혔습니다. 즉 &lt;b&gt;지표로는 이긴 소재를 못 가립니다.&lt;/b&gt; 컨셉은 데이터가 아니라 &lt;b&gt;브랜드 결정 + A/B&lt;/b&gt;로 세워야 하는 이유.&lt;/div&gt;
&lt;/div&gt;

&lt;h2&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;17 ≈ 18 — 제약이 곧 방향&lt;/h2&gt;
&lt;div class=&quot;diag&quot; style=&quot;border-left-color:var(--blue)&quot;&gt;폰이 안 바뀌니 후킹을 폰에 못 얹습니다. 경쟁 클리어 케이스도 같은 폰 위에 올라가고요. 차별점은 폰이 아니라 &lt;b&gt;PRSM 세계관&lt;/b&gt;에서만. 이번 KV의 임무 = &lt;b&gt;&quot;이건 PRSM이다&quot;가 0.5초에 읽히는 고정 장치&lt;/b&gt; 하나를 심는 것.&lt;/div&gt;

&lt;h2&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt;컨셉 — &lt;span style=&quot;color:var(--vio);margin-left:2px&quot;&gt;Prism Moment&lt;/span&gt;&lt;/h2&gt;
&lt;p class=&quot;sub2&quot;&gt;&quot;투명·링·빛&quot; 셋을 동등하게 두면 셋 다 흐려집니다. &lt;b&gt;하나의 장치(스펙트럼) + 무대(투명) + 초점(링)&lt;/b&gt;으로 위계화합니다.&lt;/p&gt;
&lt;div class=&quot;spine&quot;&gt;&lt;div class=&quot;st&quot;&gt;
 &lt;div class=&quot;eyebrow&quot;&gt;The Concept · 모든 소재가 담는 단 하나의 순간&lt;/div&gt;
 &lt;h3&gt;Prism Moment&lt;span style=&quot;display:block;font-size:16px;font-weight:700;color:#d9d9de;margin-top:7px;letter-spacing:0&quot;&gt;프리즘 모멘트 — 당신의 폰이 프리즘이 되는 순간&lt;/span&gt;&lt;/h3&gt;
 &lt;p class=&quot;ko&quot;&gt;투명 케이스를 통과한 빛이 &lt;b style=&quot;color:#fff&quot;&gt;한 줄기 스펙트럼&lt;/b&gt;으로 굴절되어 마그세이프 링을 스치는 &lt;b style=&quot;color:#fff&quot;&gt;그 한 순간&lt;/b&gt;. 모든 소재는 정확히 이 &lt;b style=&quot;color:#fff&quot;&gt;Prism Moment&lt;/b&gt; 하나를 담는다 — 그게 PRSM의 얼굴.&lt;/p&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;system&quot;&gt;
 &lt;div class=&quot;sy&quot;&gt;&lt;div class=&quot;k&quot;&gt;The Device · 후킹&lt;/div&gt;&lt;div class=&quot;t role1&quot;&gt;스펙트럼 한 줄기&lt;/div&gt;&lt;p&gt;화면을 가로지르는 굴절광 &lt;b&gt;단 하나&lt;/b&gt;. 이게 유일한 채도원이자 브랜드 각인. (전면 무지개 워시 아님)&lt;/p&gt;&lt;/div&gt;
 &lt;div class=&quot;sy&quot;&gt;&lt;div class=&quot;k&quot;&gt;The Stage · 전제&lt;/div&gt;&lt;div class=&quot;t role2&quot;&gt;투명&lt;/div&gt;&lt;p&gt;빛이 통과하는 무대. 후킹이 아니라 조건 — 카테고리 공통이라 이것만으론 차별 못 됨.&lt;/p&gt;&lt;/div&gt;
 &lt;div class=&quot;sy&quot;&gt;&lt;div class=&quot;k&quot;&gt;The Focus · 초점&lt;/div&gt;&lt;div class=&quot;t role3&quot;&gt;마그세이프 링&lt;/div&gt;&lt;p&gt;스펙트럼이 착지·반사하는 구도의 초점. 원형 모티브를 매 소재 고정.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ladder&quot;&gt;&lt;b&gt;버벌 래더:&lt;/b&gt; 투명해서 빛이 통과한다&lt;span class=&quot;arw&quot;&gt;→&lt;/span&gt;통과한 빛은 굴절한다&lt;span class=&quot;arw&quot;&gt;→&lt;/span&gt;굴절하면 스펙트럼&lt;span class=&quot;arw&quot;&gt;→&lt;/span&gt;그게 프리즘&lt;span class=&quot;arw&quot;&gt;→&lt;/span&gt;그게 &lt;b&gt;PRSM&lt;/b&gt;. 폰+PRSM = 걸어다니는 프리즘.&lt;/div&gt;
&lt;div class=&quot;test&quot;&gt;&lt;b&gt;1-glance 테스트:&lt;/b&gt; 소재를 &lt;b&gt;흑백으로 바꿨을 때 PRSM인지 못 알아보면 실패&lt;/b&gt;입니다. 스펙트럼 장치가 그만큼 약하다는 뜻 — 색을 빼도 굴절광의 형태·위치로 브랜드가 읽혀야 합니다.&lt;/div&gt;

&lt;h2&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;레퍼런스 · 두 축이 &quot;한 순간&quot;을 공유&lt;/h2&gt;
&lt;p class=&quot;sub2&quot;&gt;데이터로 검증된 두 구도. 아래 이미지는 실집행 소재에 스펙트럼 오버레이를 얹어 방향만 예시한 것 — &quot;이 그림이 이겼다&quot;는 뜻이 아닙니다.&lt;/p&gt;
&lt;div class=&quot;refs&quot;&gt;
 &lt;div class=&quot;ref&quot;&gt;&lt;figure&gt;&lt;div class=&quot;iw&quot;&gt;&lt;img class=&quot;&quot; src=&quot;https://yhbduxezupwfmcemuokt.supabase.co/storage/v1/object/public/board-img/b32.jpg&quot; alt=&quot;&quot;&gt;&lt;/div&gt;
  &lt;figcaption&gt;&lt;span class=&quot;role&quot;&gt;스타일 착용컷&lt;/span&gt; — 후킹 + 전환&lt;div class=&quot;m&quot;&gt;손·네일·질감 위로 스펙트럼 한 줄기. ★스케일 대상 사분면.&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;&lt;/div&gt;
 &lt;div class=&quot;ref&quot;&gt;&lt;figure&gt;&lt;div class=&quot;iw&quot;&gt;&lt;img class=&quot;&quot; src=&quot;https://yhbduxezupwfmcemuokt.supabase.co/storage/v1/object/public/board-img/b12.jpg&quot; alt=&quot;&quot;&gt;&lt;/div&gt;
  &lt;figcaption&gt;&lt;span class=&quot;role&quot;&gt;투명 제품 히어로&lt;/span&gt; — 전환 주력&lt;div class=&quot;m&quot;&gt;투명 소재 + 링 클로즈업. 굴절광이 링을 스침.&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;refnote&quot;&gt;※ 오버레이는 컨셉 예시용 시각효과이며 원 소재의 실제 성과와 무관합니다. 두 축 모두 &quot;스펙트럼 한 순간&quot;을 공유해 한 얼굴로 묶입니다.&lt;/p&gt;

&lt;h2&gt;&lt;span class=&quot;n&quot;&gt;5&lt;/span&gt;가져야 할 / 피해야 할 무드 (조임)&lt;/h2&gt;
&lt;div class=&quot;mood&quot;&gt;
 &lt;div class=&quot;mrow&quot;&gt;&lt;h4&gt;&lt;span class=&quot;d&quot; style=&quot;background:var(--green)&quot;&gt;&lt;/span&gt;그래파이트·니어블랙 베이스&lt;/h4&gt;&lt;p&gt;스펙트럼 한 줄기만 채도. 나머지는 전부 무채색으로 대비 확보.&lt;/p&gt;&lt;/div&gt;
 &lt;div class=&quot;mrow&quot;&gt;&lt;h4&gt;&lt;span class=&quot;d&quot; style=&quot;background:var(--red)&quot;&gt;&lt;/span&gt;전면 무지개 워시 / 컬러 남발&lt;/h4&gt;&lt;p&gt;스펙트럼이 화면을 덮으면 장치가 아니라 배경이 됨 → 각인 실패.&lt;/p&gt;&lt;/div&gt;
 &lt;div class=&quot;mrow&quot;&gt;&lt;h4&gt;&lt;span class=&quot;d&quot; style=&quot;background:var(--green)&quot;&gt;&lt;/span&gt;굴절광 = 한 방향 · 한 줄기&lt;/h4&gt;&lt;p&gt;일관된 각도(예: 좌상→우하)로 매번 같은 위치. 반복이 곧 시그니처.&lt;/p&gt;&lt;/div&gt;
 &lt;div class=&quot;mrow&quot;&gt;&lt;h4&gt;&lt;span class=&quot;d&quot; style=&quot;background:var(--red)&quot;&gt;&lt;/span&gt;무드만 있고 케이스 안 읽히는 에디토리얼&lt;/h4&gt;&lt;p&gt;순수 라이프스타일 후킹은 전환 0 수렴(시딩 ROAS 0.14~0.33) → 판매 캠페인 제외.&lt;/p&gt;&lt;/div&gt;
 &lt;div class=&quot;mrow&quot;&gt;&lt;h4&gt;&lt;span class=&quot;d&quot; style=&quot;background:var(--green)&quot;&gt;&lt;/span&gt;링을 스펙트럼의 착지점으로&lt;/h4&gt;&lt;p&gt;원형 초점 + 굴절광 = 0.5초 각인 조합.&lt;/p&gt;&lt;/div&gt;
 &lt;div class=&quot;mrow&quot;&gt;&lt;h4&gt;&lt;span class=&quot;d&quot; style=&quot;background:var(--red)&quot;&gt;&lt;/span&gt;텍스트·카피 도배 / 밝은 파스텔 톤&lt;/h4&gt;&lt;p&gt;0.5초 룰 방해 + 대비 붕괴. 카피는 크게 1줄까지.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h2&gt;&lt;span class=&quot;n&quot;&gt;6&lt;/span&gt;검증됨 vs 베팅 — 정직하게 구분&lt;/h2&gt;
&lt;div class=&quot;split&quot;&gt;
 &lt;div class=&quot;col ok&quot;&gt;&lt;h4&gt;✓ 데이터로 검증됨&lt;/h4&gt;&lt;ul&gt;
  &lt;li&gt;투명 제품 히어로 · 스타일 착용컷이 전환을 만든다.&lt;/li&gt;
  &lt;li&gt;순수 라이프스타일·매거진 후킹은 안 판다.&lt;/li&gt;
  &lt;li&gt;소재명·메타 지표로는 승자를 못 가린다(동일 이미지 ROAS 0.63~1.86).&lt;/li&gt;
 &lt;/ul&gt;&lt;/div&gt;
 &lt;div class=&quot;col bet&quot;&gt;&lt;h4&gt;⚑ 아직 창작 베팅 (검증 필요)&lt;/h4&gt;&lt;ul&gt;
  &lt;li&gt;&quot;스펙트럼 장치 고정 → 브랜드 인지·재구매 상승&quot;은 가설.&lt;/li&gt;
  &lt;li&gt;굴절광의 형태·각도·색 중 무엇이 먹히는지 미검증.&lt;/li&gt;
  &lt;li&gt;→ 장치 강도별 KV 2~3안 &lt;b&gt;A/B + utm_content로 매출 귀속&lt;/b&gt;. 지금 GO 못 박음.&lt;/li&gt;
 &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;oneliner&quot;&gt;&quot;폰은 그대로다. 바뀌는 건 그 위를 지나는 한 줄기 빛 — 투명을 프리즘으로.&quot;&lt;/div&gt;

&lt;h2&gt;&lt;span class=&quot;n&quot;&gt;7&lt;/span&gt;디자인팀 제출 스펙 (조임)&lt;/h2&gt;
&lt;div class=&quot;spec&quot;&gt;
 &lt;div&gt;&lt;b&gt;필수 장치&lt;/b&gt; 스펙트럼 한 줄기(유일 채도) + 마그세이프 링 초점. 매 소재 반드시 포함 · 1-glance(흑백) 테스트 통과.&lt;/div&gt;
 &lt;div&gt;&lt;b&gt;금지&lt;/b&gt; 전면 무지개 워시 · 다색 남발 · 밝은 파스텔 배경 · 카피 2줄 이상.&lt;/div&gt;
 &lt;div&gt;&lt;b&gt;비율&lt;/b&gt; 1:1 · 4:5 필수(필요시 9:16). 컨셉당 히어로 1점 + 착용컷 1점 세트.&lt;/div&gt;
 &lt;div&gt;&lt;b&gt;색·조명&lt;/b&gt; 그래파이트/니어블랙 베이스 + 바이올렛→시안 스펙트럼 1포인트. 컨트롤된 하이라이트.&lt;/div&gt;
 &lt;div&gt;&lt;b&gt;역할&lt;/b&gt; 제품 히어로=전환, 착용컷=후킹+전환, 라이프스타일=인지 전용.&lt;/div&gt;
 &lt;div&gt;&lt;b&gt;검증&lt;/b&gt; 장치 강도별 2~3안 A/B 전제 · 소재별 utm_content 태깅으로 자사몰 매출 귀속.&lt;/div&gt;
&lt;/div&gt;

&lt;p class=&quot;foot&quot;&gt;지표는 메타 자기보고(소액일수록 노이즈)와 자사몰 실매출 MER에 근거. 컨셉·무드는 데이터가 지지하는 방향 위에 세운 창작 제안이며 확정은 A/B 후. 레퍼런스 이미지는 아이폰17 PRSM 실집행 소재(화질 확보분)에 컨셉 오버레이를 얹은 예시로, 파일에 내장되어 링크 만료와 무관합니다.&lt;/p&gt;

&lt;div class=&quot;kicker&quot;&gt;SLBS · PRSM Clear Line · iPhone 18 · v2 (톤 교정)&lt;/div&gt;
&lt;h1&gt;Prism Moment — 실사 레퍼런스 헌팅 보드&lt;/h1&gt;
&lt;p class=&quot;lead&quot;&gt;일반 검색은 80%가 밝습니다. 이 보드는 &lt;b&gt;검정 배경으로 pre-filter된 링크&lt;/b&gt;만 씁니다.&lt;/p&gt;
&lt;p class=&quot;meta&quot;&gt;2026-08 재큐레이션 · 밝은 톤 링크는 하단 &quot;✕ 반례&quot;로 격리 · 컨셉 원페이저 v3와 세트&lt;/p&gt;

&lt;div class=&quot;rule&quot;&gt;
 &lt;div class=&quot;e&quot;&gt;가장 중요한 검색 규칙&lt;/div&gt;
 &lt;h3&gt;&quot;prism / rainbow / holographic&quot;만 치면 밝은 게 쏟아진다&lt;/h3&gt;
 &lt;p&gt;대중적 미감이 밝은 무지개라, 일반 검색·핀터레스트 피드는 우리 톤과 반대입니다. 반드시 &lt;b&gt;검색어에 &lt;code&gt;black background&lt;/code&gt;를 붙이거나&lt;/b&gt;, 스톡 사이트의 &lt;b&gt;배경색 필터를 &quot;검정&quot;&lt;/b&gt;으로 거세요(iStock: 세분화→배경→검정). 그래야 &quot;어둠 속 한 줄기 분광&quot;이 나옵니다.&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;legend&quot;&gt;
 &lt;span class=&quot;pill&quot;&gt;&lt;span class=&quot;tag t-dev&quot; style=&quot;padding:1px 6px&quot;&gt;장치&lt;/span&gt; 스펙트럼 한 줄기&lt;/span&gt;
 &lt;span class=&quot;pill&quot;&gt;&lt;span class=&quot;tag t-base&quot; style=&quot;padding:1px 6px&quot;&gt;베이스&lt;/span&gt; 그래파이트·다크&lt;/span&gt;
 &lt;span class=&quot;pill&quot;&gt;&lt;span class=&quot;tag t-ring&quot; style=&quot;padding:1px 6px&quot;&gt;초점&lt;/span&gt; 마그세이프 링&lt;/span&gt;
 &lt;span class=&quot;pill&quot;&gt;&lt;span class=&quot;tag t-ref&quot; style=&quot;padding:1px 6px&quot;&gt;직접&lt;/span&gt; 온-브리프&lt;/span&gt;
 &lt;span class=&quot;pill&quot;&gt;&lt;span class=&quot;tag t-no&quot; style=&quot;padding:1px 6px&quot;&gt;반례&lt;/span&gt; 피할 톤&lt;/span&gt;
&lt;/div&gt;

&lt;div class=&quot;northstar&quot;&gt;&lt;b&gt;노스스타(개념 원형):&lt;/b&gt; Pink Floyd 〈The Dark Side of the Moon〉 — 검은 배경, 백색광 한 줄기가 프리즘을 통과해 스펙트럼으로 갈라짐. 이게 Prism Moment의 원형입니다. 아래 레퍼런스도 전부 &quot;이 감각에 얼마나 가까운가&quot;로 골랐습니다.&lt;/div&gt;

&lt;h2&gt;&lt;span class=&quot;bnum&quot;&gt;A&lt;/span&gt;검정 배경 프리즘·분광 (pre-filtered)&lt;/h2&gt;
&lt;p class=&quot;bdesc&quot;&gt;검색어/필터에 &quot;black background&quot;가 박혀 있어 &lt;b&gt;어두운 결과만&lt;/b&gt; 나오는 페이지. 여기서 &quot;한 줄기가 갈라지는&quot; 컷만 셀렉.&lt;/p&gt;
&lt;div class=&quot;cards&quot;&gt;
 &lt;div class=&quot;card ok&quot;&gt;&lt;span class=&quot;src&quot;&gt;Dreamstime · 검정필터&lt;/span&gt;&lt;a class=&quot;t&quot; href=&quot;https://www.dreamstime.com/photos-images/prism-black-background.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Prism — Black Background (4,374컷)&lt;/a&gt;&lt;span class=&quot;steal&quot;&gt;&lt;b&gt;✓ 훔칠 것:&lt;/b&gt; 검은 바탕 위 프리즘 실광. 페이지 전체가 다크라 톤 오염이 적음. 한 줄기·사선 위주로 선별.&lt;/span&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag t-dev&quot;&gt;장치&lt;/span&gt;&lt;span class=&quot;tag t-base&quot;&gt;베이스&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;card ok&quot;&gt;&lt;span class=&quot;src&quot;&gt;Shutterstock · 검정필터&lt;/span&gt;&lt;a class=&quot;t&quot; href=&quot;https://www.shutterstock.com/search/prism-reflections-black-background&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Prism Reflections — Black Background (8,411컷)&lt;/a&gt;&lt;span class=&quot;steal&quot;&gt;&lt;b&gt;✓ 훔칠 것:&lt;/b&gt; 검은 배경 프리즘 반사·분광. 굴절광이 &quot;선&quot;으로 지나가는 컷 위주.&lt;/span&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag t-dev&quot;&gt;장치&lt;/span&gt;&lt;span class=&quot;tag t-base&quot;&gt;베이스&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;card ok&quot;&gt;&lt;span class=&quot;src&quot;&gt;Dreamstime · 검정필터&lt;/span&gt;&lt;a class=&quot;t&quot; href=&quot;https://www.dreamstime.com/photos-images/iridescent-prism-light-effect-black-background.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Iridescent Prism Light Effect — Black BG (138컷)&lt;/a&gt;&lt;span class=&quot;steal&quot;&gt;&lt;b&gt;✓ 훔칠 것:&lt;/b&gt; 검정 위 프리즘 라이트 이펙트. 후반 screen 합성용 오버레이 소스로 바로 쓸 톤.&lt;/span&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag t-dev&quot;&gt;장치&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;card ok&quot;&gt;&lt;span class=&quot;src&quot;&gt;Freepik · 특정컷&lt;/span&gt;&lt;a class=&quot;t&quot; href=&quot;https://www.freepik.com/premium-photo/rgb-crystal-prism-light-dispersion-black-background_31903789.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RGB Crystal Prism Dispersion on Black&lt;/a&gt;&lt;span class=&quot;steal&quot;&gt;&lt;b&gt;✓ 훔칠 것:&lt;/b&gt; 검은 배경 크리스탈 프리즘이 RGB로 분광하는 딱 그 컷. Prism Moment에 가장 근접한 단일 레퍼런스.&lt;/span&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag t-dev&quot;&gt;장치&lt;/span&gt;&lt;span class=&quot;tag t-ring&quot;&gt;초점&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h2&gt;&lt;span class=&quot;bnum&quot;&gt;B&lt;/span&gt;다크 베이스 무드&lt;/h2&gt;
&lt;p class=&quot;bdesc&quot;&gt;그래파이트·니어블랙 바탕 무드. &lt;b&gt;어두운 것만&lt;/b&gt; — 밝은 홀로그래픽은 반례로 뺐습니다.&lt;/p&gt;
&lt;div class=&quot;cards&quot;&gt;
 &lt;div class=&quot;card ok&quot;&gt;&lt;span class=&quot;src&quot;&gt;YouWorkForThem · 앵커&lt;/span&gt;&lt;a class=&quot;t&quot; href=&quot;https://www.youworkforthem.com/graphic/E16217/iridescent-noir-dark-holographic-backgrounds&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Iridescent Noir — Dark Holographic&lt;/a&gt;&lt;span class=&quot;steal&quot;&gt;&lt;b&gt;✓ 훔칠 것:&lt;/b&gt; &quot;누아르&quot; — 검은 바탕에 색이 은은하게 스며든 어두운 컷. 우리 베이스톤과 거의 일치. &lt;b&gt;색 강한 컷은 제외.&lt;/b&gt;&lt;/span&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag t-base&quot;&gt;베이스&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;card ok&quot;&gt;&lt;span class=&quot;src&quot;&gt;Dreamstime · 다크&lt;/span&gt;&lt;a class=&quot;t&quot; href=&quot;https://www.dreamstime.com/illustration/prism-refraction-spectrum-dark-background.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Prism Refraction Spectrum — Dark Background&lt;/a&gt;&lt;span class=&quot;steal&quot;&gt;&lt;b&gt;✓ 훔칠 것:&lt;/b&gt; 어두운 배경 위 분광 스펙트럼 일러스트. 그래파이트 베이스 + 한 줄기 방향의 참고.&lt;/span&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag t-base&quot;&gt;베이스&lt;/span&gt;&lt;span class=&quot;tag t-dev&quot;&gt;장치&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h2&gt;&lt;span class=&quot;bnum&quot;&gt;C&lt;/span&gt;직접 온-브리프 — 클리어 케이스 경쟁사&lt;/h2&gt;
&lt;p class=&quot;bdesc&quot;&gt;같은 제품군(투명 마그세이프) 실제 히어로 촬영. &lt;b&gt;구도·조명·링 처리&lt;/b&gt; 벤치마크. 복제 아님.&lt;/p&gt;
&lt;div class=&quot;cards&quot;&gt;
 &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;src&quot;&gt;Mous&lt;/span&gt;&lt;a class=&quot;t&quot; href=&quot;https://www.mous.co/products/protective-clear-phone-case-magnetic-clarity&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Mous — Clarity MagSafe&lt;/a&gt;&lt;span class=&quot;steal&quot;&gt;&lt;b&gt;훔칠 것:&lt;/b&gt; 투명 소재를 &quot;고급&quot;으로 보이게 하는 조명. 여기에 &lt;b&gt;스펙트럼 한 줄기&lt;/b&gt;를 얹으면 차이가 명확.&lt;/span&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag t-ref&quot;&gt;직접&lt;/span&gt;&lt;span class=&quot;tag t-ring&quot;&gt;초점&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;src&quot;&gt;RHINOSHIELD&lt;/span&gt;&lt;a class=&quot;t&quot; href=&quot;https://rhinoshield.io/products/clear&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RHINOSHIELD — Clear MagSafe&lt;/a&gt;&lt;span class=&quot;steal&quot;&gt;&lt;b&gt;훔칠 것:&lt;/b&gt; 마그세이프 링을 시각 초점으로 쓰는 클로즈업. 우리 &quot;초점=링&quot; 확인.&lt;/span&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag t-ref&quot;&gt;직접&lt;/span&gt;&lt;span class=&quot;tag t-ring&quot;&gt;초점&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;src&quot;&gt;Evolved&lt;/span&gt;&lt;a class=&quot;t&quot; href=&quot;https://evolvedchargers.com/products/apple-iphone-magsafe-case-transparent&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Evolved — Transparent MagSafe&lt;/a&gt;&lt;span class=&quot;steal&quot;&gt;&lt;b&gt;훔칠 것:&lt;/b&gt; 슬림 투명 케이스 엣지·굴절 하이라이트. 유리물성 강조.&lt;/span&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag t-ref&quot;&gt;직접&lt;/span&gt;&lt;span class=&quot;tag t-dev&quot;&gt;장치&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;src&quot;&gt;Mous · 일관성&lt;/span&gt;&lt;a class=&quot;t&quot; href=&quot;https://www.mous.co/products/clear-phone-case-clarity_3_magsafe_compatible-button&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Mous — Clarity (다른 컷)&lt;/a&gt;&lt;span class=&quot;steal&quot;&gt;&lt;b&gt;훔칠 것:&lt;/b&gt; 같은 브랜드가 &quot;하나의 얼굴&quot;을 어떻게 반복하는지. 우리가 목표하는 시그니처 일관성 사례.&lt;/span&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag t-ref&quot;&gt;직접&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h2&gt;&lt;span class=&quot;bnum no&quot;&gt;✕&lt;/span&gt;반례 갤러리 — 이런 건 고르지 마세요&lt;/h2&gt;
&lt;p class=&quot;bdesc&quot;&gt;전부 밝거나 전면 무지개. 참고용이 아니라 &lt;b&gt;&quot;이 톤은 피한다&quot;&lt;/b&gt;는 교보재입니다.&lt;/p&gt;
&lt;div class=&quot;cards&quot;&gt;
 &lt;div class=&quot;card no&quot;&gt;&lt;span class=&quot;src&quot;&gt;Behance · 반례&lt;/span&gt;&lt;a class=&quot;t&quot; href=&quot;https://www.behance.net/gallery/120970647/IRIDETEX-Holographic-Iridescent-Textures-Pack&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IRIDETEX — 밝은 전면 무지개&lt;/a&gt;&lt;span class=&quot;steal&quot;&gt;&lt;b&gt;✕ 왜 반례:&lt;/b&gt; 밝은 실버 위 전면 무지개 텍스처. 장치가 배경이 됨 = 우리 컨셉의 정반대.&lt;/span&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag t-no&quot;&gt;반례&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;card no&quot;&gt;&lt;span class=&quot;src&quot;&gt;iStock · 반례&lt;/span&gt;&lt;a class=&quot;t&quot; href=&quot;https://www.istockphoto.com/photos/prism-light&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&quot;prism light&quot; 일반 검색&lt;/a&gt;&lt;span class=&quot;steal&quot;&gt;&lt;b&gt;✕ 왜 반례:&lt;/b&gt; 투명 체커보드 오버레이·밝은 플레어 태반. &quot;black background&quot; 필터 없이 검색하면 이렇게 나옴.&lt;/span&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag t-no&quot;&gt;반례&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;card no&quot;&gt;&lt;span class=&quot;src&quot;&gt;Pinterest · 반례&lt;/span&gt;&lt;a class=&quot;t&quot; href=&quot;https://www.pinterest.com/ideas/rainbow-light-reflection/961292236203/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Rainbow Light Reflection 피드&lt;/a&gt;&lt;span class=&quot;steal&quot;&gt;&lt;b&gt;✕ 왜 반례:&lt;/b&gt; 밝은 벽·햇살 무지개가 80%. 피드는 필터가 안 돼서 우리 톤이 소수. 스크랩 비효율.&lt;/span&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag t-no&quot;&gt;반례&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;card no&quot;&gt;&lt;span class=&quot;src&quot;&gt;일반 검색 전반&lt;/span&gt;&lt;span class=&quot;t&quot; style=&quot;color:var(--sub);cursor:default&quot;&gt;holographic / iridescent 텍스처 팩&lt;/span&gt;&lt;span class=&quot;steal&quot;&gt;&lt;b&gt;✕ 왜 반례:&lt;/b&gt; 대부분 밝은 다색 그리드. &quot;홀로그래픽&quot;이라는 단어 자체가 밝은 결과를 끌어옴 → 검색어에서 배제.&lt;/span&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag t-no&quot;&gt;반례&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h2&gt;&lt;span class=&quot;bnum&quot;&gt;D&lt;/span&gt;이 보드 사용법&lt;/h2&gt;
&lt;div class=&quot;usebox&quot;&gt;
 &lt;div&gt;&lt;b&gt;1. 검색 규칙&lt;/b&gt; 항상 &lt;code&gt;black background&lt;/code&gt; 추가 or 사이트 배경색 필터=검정. &quot;holographic&quot;은 검색어에서 빼기.&lt;/div&gt;
 &lt;div&gt;&lt;b&gt;2. 셀렉 기준&lt;/b&gt; &quot;한 줄기가 갈라지는&quot; 컷만. 전면 무지개·밝은 바탕·체커보드 오버레이는 버림.&lt;/div&gt;
 &lt;div&gt;&lt;b&gt;3. 링 초점&lt;/b&gt; C의 경쟁사 컷에서 링 처리 벤치 → 우리는 &quot;링을 스펙트럼 착지점&quot;으로 한 단계 더.&lt;/div&gt;
 &lt;div&gt;&lt;b&gt;4. 흑백 검증&lt;/b&gt; 셀렉을 흑백 변환해도 빛줄기 형태가 남는 컷만 → 1-glance 통과.&lt;/div&gt;
 &lt;div&gt;&lt;b&gt;5. 산출물&lt;/b&gt; 셀렉 20~30장으로 자체 무드보드 1장 → 촬영 지시서 첨부.&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;warn&quot;&gt;&lt;b&gt;라이선스 주의:&lt;/b&gt; Dreamstime·Shutterstock·iStock·Freepik·YouWorkForThem은 &lt;b&gt;실사용 시 라이선스 구매 필수&lt;/b&gt;. Behance·Pinterest·경쟁사는 &lt;b&gt;무드 참고용, 직접 사용·복제 금지&lt;/b&gt;. 최종 소재는 자체 촬영/제작이어야 합니다.&lt;/div&gt;

&lt;p class=&quot;foot&quot;&gt;v2 재큐레이션(2026-08). 이전 버전이 일반 검색 페이지(밝은 톤 다수)를 걸었던 문제를 교정 — 검정 배경 pre-filtered 링크만 남기고, 밝은 링크는 반례로 격리했습니다. Prism Moment 컨셉 원페이저 v3의 스펙(장치·베이스·초점·1-glance)에 매핑.&lt;/p&gt;

&lt;div class=&quot;kicker&quot;&gt;SLBS · PRSM · iPhone 18 · 도식(Schematic)&lt;/div&gt;
&lt;h1&gt;베이스톤 — &quot;그래파이트 위 한 줄기&quot;가 뭔가&lt;/h1&gt;
&lt;p class=&quot;lead&quot;&gt;말로만 &quot;다크 홀로그래픽&quot;이면 감이 안 옵니다. 아래 도식으로 &lt;b&gt;베이스(배경톤)&lt;/b&gt;부터 그 위에 Prism Moment를 얹는 방식까지 보여드립니다.&lt;/p&gt;
&lt;p class=&quot;meta&quot;&gt;아래 그림은 원리를 설명하는 도식이지 최종 촬영 퀄리티가 아닙니다 · 색값은 실제 스펙&lt;/p&gt;

&lt;h2&gt;&lt;span class=&quot;bnum&quot;&gt;1&lt;/span&gt;베이스톤이란 = &quot;배경이 무슨 톤이냐&quot;&lt;/h2&gt;
&lt;p class=&quot;sub2&quot;&gt;소재의 &lt;b&gt;바탕색&lt;/b&gt; 이야기입니다. 순검정도, 밝은 파스텔도 아닌 &lt;b&gt;그래파이트(짙은 무채색, 살짝 차가운)&lt;/b&gt;. 이 어두운 바탕이 있어야 위에 얹는 스펙트럼 한 줄기가 대비로 살아납니다.&lt;/p&gt;
&lt;div class=&quot;swatches&quot;&gt;
 &lt;div class=&quot;sw&quot;&gt;&lt;div class=&quot;chip&quot; style=&quot;background:#050506&quot;&gt;&lt;span class=&quot;hexlbl&quot;&gt;#050506&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;span class=&quot;badge b-no&quot;&gt;피함&lt;/span&gt;&lt;br&gt;&lt;b style=&quot;margin-top:4px;display:inline-block&quot;&gt;순검정 (Flat Black)&lt;/b&gt;&lt;div class=&quot;d&quot;&gt;완전 새까매서 케이스 형태·질감이 안 읽힘. 밋밋하고 싸 보임.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;sw&quot;&gt;&lt;div class=&quot;chip&quot; style=&quot;background:linear-gradient(140deg,#26262c,#141418 55%,#0c0c10)&quot;&gt;&lt;span class=&quot;hexlbl&quot;&gt;#1a1a1e ↔ #0c0c10&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;span class=&quot;badge b-ok&quot;&gt;권장 · 베이스톤&lt;/span&gt;&lt;br&gt;&lt;b style=&quot;margin-top:4px;display:inline-block&quot;&gt;그래파이트 (Near-Black)&lt;/b&gt;&lt;div class=&quot;d&quot;&gt;짙은 회흑색이 은은하게 톤 변화. 유리·굴절광이 살아나는 무대.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;sw&quot;&gt;&lt;div class=&quot;chip&quot; style=&quot;background:linear-gradient(140deg,#ffd9ec,#d5e8ff)&quot;&gt;&lt;span class=&quot;hexlbl&quot;&gt;파스텔&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;span class=&quot;badge b-no&quot;&gt;금지&lt;/span&gt;&lt;br&gt;&lt;b style=&quot;margin-top:4px;display:inline-block&quot;&gt;밝은 파스텔&lt;/b&gt;&lt;div class=&quot;d&quot;&gt;예전 IP 무드 흔적. 스펙트럼이 배경에 묻혀 장치가 안 보임.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h2&gt;&lt;span class=&quot;bnum&quot;&gt;2&lt;/span&gt;그 베이스 위에 Prism Moment를 얹으면&lt;/h2&gt;
&lt;p class=&quot;sub2&quot;&gt;그래파이트 바탕(무대) + 마그세이프 링(초점) + &lt;b&gt;스펙트럼 한 줄기(장치)&lt;/b&gt;가 링을 스치는 순간. 딱 이 세 가지.&lt;/p&gt;

&lt;h2&gt;&lt;span class=&quot;bnum&quot;&gt;5&lt;/span&gt;촬영·후반 레시피 (이 도식을 실사로)&lt;/h2&gt;
&lt;div class=&quot;recipe&quot;&gt;
 &lt;div&gt;&lt;b&gt;배경&lt;/b&gt; 그래파이트 무광 지관/아크릴(#1a1a1e~#0c0c10). 순검정·밝은 배경 금지.&lt;/div&gt;
 &lt;div&gt;&lt;b&gt;스펙트럼 광&lt;/b&gt; 실촬: 유리 프리즘/광파이버에 스팟광 → 한 줄기 분광. 후반: 바이올렛→시안 스트릭 1개를 screen 합성(무지개 워시 금지).&lt;/div&gt;
 &lt;div&gt;&lt;b&gt;각도·위치&lt;/b&gt; 사선 한 방향(예: 좌상→우하) 고정. 매 소재 같은 위치라야 시그니처.&lt;/div&gt;
 &lt;div&gt;&lt;b&gt;링 처리&lt;/b&gt; 빛줄기가 마그세이프 링을 스치는 지점에 하이라이트. 시선 초점=링.&lt;/div&gt;
 &lt;div&gt;&lt;b&gt;검증&lt;/b&gt; 완성 컷을 흑백 변환 → 빛줄기 형태가 남는지 1-glance 확인 후 통과.&lt;/div&gt;
&lt;/div&gt;

&lt;p class=&quot;foot&quot;&gt;본 문서의 그림은 원리 전달용 벡터 도식입니다(최종 촬영물 아님). 색값·각도·합성 방식은 실제 제작 스펙이며, 실사는 촬영/후반으로 구현합니다. Prism Moment 컨셉 원페이저 v3와 세트.&lt;/p&gt;
