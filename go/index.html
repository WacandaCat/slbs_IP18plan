<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><link rel="icon" href="data:,">
<title>SLASH B SLASH</title>
<style>
:root{--bg:#0e0e11;--ink:#f5f5f7;--sub:#9a9aa6;--line:#2a2a32}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:400px;text-align:center}
.sp{width:28px;height:28px;border:3px solid var(--line);border-top-color:#fff;border-radius:50%;margin:0 auto 16px;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
h1{font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
p{color:var(--sub);font-size:14px;margin:0 0 22px}
.btn{display:block;width:100%;padding:16px;border-radius:14px;background:#fff;color:#111;font-weight:800;font-size:16px;text-decoration:none;margin-bottom:10px}
.btn.alt{background:transparent;border:1px solid var(--line);color:#fff}
.dbg{margin-top:26px;font-size:11px;color:#55555f;word-break:break-all}
[hidden]{display:none!important}
</style></head><body>
<div class="box">
  <div id="wait"><div class="sp"></div><h1>기기를 확인하고 있어요</h1><p>잠시만 기다려 주세요.</p></div>
  <div id="pick" hidden>
    <h1>어떤 기기를 쓰시나요?</h1><p>기기에 맞는 테마 페이지로 이동합니다.</p>
    <a class="btn" id="bi" href="#">iPhone</a>
    <a class="btn alt" id="bg" href="#">Galaxy</a>
  </div>
  <div class="dbg" id="dbg" hidden></div>
</div>
<script>
(function(){
  // 브랜드별 목적지. 없는 브랜드는 선택 화면으로.
  var ROUTES = {
    apple:   'https://humetro.slashbslash.ai/',
    samsung: 'https://apps.samsung.com/theme/ProductDetail.as?appId=SLBS.ShiningGwanganStation'
    // sony: '...', oppo: '...', huawei: '...', xiaomi: '...', google: '...'  ← 필요 시 추가
  };
  var q = new URLSearchParams(location.search);
  var ua = navigator.userAgent || '';
  var uad = navigator.userAgentData;
  var info = { ua: ua, touch: navigator.maxTouchPoints || 0, platform: (uad && uad.platform) || navigator.platform || '' };

  function isIOS(){
    if (/iPhone|iPod|iPad/.test(ua)) return true;
    return /Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1; // iPadOS 13+ 위장
  }
  function isAndroid(){ return /Android/i.test(ua) || (uad && uad.platform === 'Android'); }

  // 모델 문자열(UA 또는 Client Hints) → 브랜드
  var BRANDS = [
    ['samsung',  /(SM-[A-Z]\d|SAMSUNG|SamsungBrowser|GT-[INS]\d|SHV-E|SCH-[IRS]|SGH-)/i],
    ['sony',     /(Xperia|XQ-[A-Z]{2}\d|SO-\d{2}[A-Z]|SOV\d{2}|SOG\d{2}|\bSony\b)/i],
    ['oppo',     /(\bOPPO\b|CPH\d{4}|PE[A-Z]M\d{2}|PD[A-Z]M\d{2}|PF[A-Z]M\d{2}|PG[A-Z]M\d{2}|PH[A-Z]M\d{2}|\bA\d{2,3}[a-z]?\b.*OPPO)/i],
    ['realme',   /(realme|RMX\d{4})/i],
    ['oneplus',  /(OnePlus|ONEPLUS|\b(KB|LE|NE|CPH2\d{3}|IN|BE|DN|EB|GM|HD|AC|IV)\d{4}\b(?=.*OnePlus)|A\d{4}(?=.*ONEPLUS))/i],
    ['huawei',   /(HUAWEI|HarmonyOS|HMSCore|\b(ELS|ANA|NOH|LIO|VOG|ELE|MAR|POT|STK|JNY|ANE|CLT|EML|MHA|BLA|LYA|EVR|TAS|OCE|NOP|JAD|BAL|ANG|CDY|AQM|MED|DUB|JAT|ART|MRD|DRA|YAL|SEA|PCT|VCE|INE|LLD|COL|BKL|FIG|LDN|SLA|WAS|DIG|DLI|CAM|VNS|ATU|NEM|FLA|TRT|AGS|KOB|BAH|CMR|SCM|MRX|TAH|OSN|WLZ|GLA|CET|NEN|ALP|LON|MON|VTR|VKY|PAR|HRY|STF|RNE|LND|VIE|PLK|NXT|HWI|EDI|ALE|CHM|PE-|MT7|BND|CAN|LYO|AUM|CRO|JKM|POT|TNY|ALP)-[A-Z]{2}\d{2}\b)/i],
    ['honor',    /(HONOR|\b(ANY|NTH|CMA|TFY|HRY|LRA|JAT|COL|BKL|DUK|NEM|PLK|KIW|SCL|STF|CAM|NEM|PRA|BND|LLD|BKK|JSN|HLK|YAL|OXF|EBG|ELZ|VNE|RMO|CRT|MGI|MGA|GDL|FNE|NEN|ALI|ALT|CRT|RKY|RMO|VNE|WDY|PGT|MAA|BVL|ALA|ELP|ANY|FRI|PGT)-[A-Z]{2}\d{2}\b(?=.*HONOR))/i],
    ['xiaomi',   /(Xiaomi|\bMI\s?\d|Redmi|POCO|\bM2\d{3}[A-Z0-9]+\b|\b2\d{6,7}[A-Z]{1,3}\b|MIUI)/i],
    ['google',   /(\bPixel\b|Nexus)/i],
    ['lg',       /(\bLG[-\s]|LM-[A-Z]\d{3}|LGM-|\bLGE\b)/i],
    ['motorola', /(\bmoto\b|Motorola|XT\d{4})/i],
    ['vivo',     /(\bvivo\b|\bV\d{4}[A-Z]?\b(?=.*vivo)|iQOO)/i],
    ['nothing',  /(Nothing Phone|\bA0\d{2}\b(?=.*Nothing))/i],
    ['asus',     /(ASUS|ZenFone|ROG Phone|\bAI\d{4}\b|\bZS\d{3}[A-Z]{2}\b)/i]
  ];
  function brandOf(str){
    for (var i = 0; i < BRANDS.length; i++) if (BRANDS[i][1].test(str)) return BRANDS[i][0];
    return null;
  }

  function finish(brand, why){
    info.brand = brand || 'unknown'; info.why = why;
    var url = brand && ROUTES[brand];
    if (url && q.get('stay') !== '1') { location.replace(url); return; }
    show();
  }
  function show(){
    document.getElementById('wait').hidden = true;
    document.getElementById('pick').hidden = false;
    document.getElementById('bi').href = ROUTES.apple; document.getElementById('bg').href = ROUTES.samsung;
    if (q.get('stay') === '1' || q.get('debug') === '1') { var d = document.getElementById('dbg'); d.hidden = false; d.textContent = JSON.stringify(info); }
  }

  var force = q.get('force');
  if (force === 'iphone') force = 'apple'; if (force === 'galaxy') force = 'samsung';
  if (force) return finish(force, 'force');
  if (isIOS()) return finish('apple', 'ios');
  if (!isAndroid()) return finish(null, 'desktop');

  var b = brandOf(ua);
  if (b) return finish(b, 'ua');
  // 크롬(안드로이드)은 UA 모델명을 'K'로 가리므로 Client Hints에서 모델명 조회
  if (uad && uad.getHighEntropyValues) {
    uad.getHighEntropyValues(['model']).then(function(h){
      info.model = h.model || '';
      finish(brandOf(info.model + ' ' + ua), info.model ? 'hint' : 'hint-empty');
    }).catch(function(){ finish(null, 'hint-fail'); });
    return;
  }
  finish(null, 'android-unknown');
})();
</script></body></html>
