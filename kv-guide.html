&lt;div class=&quot;kicker&quot;&gt;SLBS · KV Direction&lt;/div&gt;
&lt;h1&gt;KV 디렉션 — 신제품 라인 · 디자인 요청서&lt;/h1&gt;
&lt;p class=&quot;lead&quot;&gt;아이폰17 광고 실데이터에서 검증된 KV 무드 가이드. 디자인팀 KV 제작 기준.&lt;/p&gt;
&lt;p class=&quot;meta&quot;&gt;근거: 메타 전 소재 반응(CTR)·성과(전환율) · PRSM/모노클리어 콘텐츠 보드 · 이긴 KV=영구 이미지, 죽은 KV=참고(임시 이미지, 만료 가능)&lt;/p&gt;

&lt;div class=&quot;role&quot;&gt;&lt;b&gt;KV의 역할부터.&lt;/b&gt; KV는 &lt;b&gt;파는 소재가 아니라 멈추게 하고 알아보게 하는 소재&lt;/b&gt;입니다. 데이터상 KV는 CTR 최고(3~5%)지만 전환은 최하급(1.3%) — &quot;이 KV로 팔아달라&quot;가 아니라 &lt;b&gt;&quot;스크롤을 멈추고 0.5초 안에 무슨 IP·무슨 케이스인지 각인시켜달라&quot;&lt;/b&gt;가 요청의 본질입니다. 전환은 뒤에 붙는 제품 클로즈업컷이 담당하니, KV는 &lt;b&gt;세트로 제품컷 1~2점과 함께&lt;/b&gt; 요청하세요.&lt;/div&gt;

&lt;h2&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--green)&quot;&gt;&lt;/span&gt;가져야 할 무드 (MUST-HAVE)&lt;/h2&gt;
&lt;div class=&quot;rules&quot;&gt;
 &lt;div class=&quot;rule&quot;&gt;&lt;div class=&quot;n&quot;&gt;1&lt;/div&gt;&lt;div&gt;&lt;h4&gt;캐릭터 히어로&lt;/h4&gt;&lt;p&gt;IP 캐릭터가 크고 또렷하게, 표정·포즈로 즉각 인지되게.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;rule&quot;&gt;&lt;div class=&quot;n&quot;&gt;2&lt;/div&gt;&lt;div&gt;&lt;h4&gt;제품 가독성 (오브제 우선)&lt;/h4&gt;&lt;p&gt;케이스가 폰에 씌워진 실물이 선명하게 보여야. 패턴보다 제품이 주인공.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;rule&quot;&gt;&lt;div class=&quot;n&quot;&gt;3&lt;/div&gt;&lt;div&gt;&lt;h4&gt;밝고 깨끗·경쾌&lt;/h4&gt;&lt;p&gt;하이키 조명, 여백, 파스텔·발랄한 톤. 무겁고 어두운 무드 금지.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;rule&quot;&gt;&lt;div class=&quot;n&quot;&gt;4&lt;/div&gt;&lt;div&gt;&lt;h4&gt;1초 룰&lt;/h4&gt;&lt;p&gt;피드 썸네일 크기에서 IP+케이스가 즉시 읽히게. 텍스트 최소, 요소는 크게.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;rule&quot;&gt;&lt;div class=&quot;n&quot;&gt;5&lt;/div&gt;&lt;div&gt;&lt;h4&gt;컬렉션 무드&lt;/h4&gt;&lt;p&gt;여러 캐릭터를 한 프레임에 모은 단체·라인업 컷이 효율 최고(산리오 단체 2.05·1+1 3.23).&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;rule&quot;&gt;&lt;div class=&quot;n&quot;&gt;✓&lt;/div&gt;&lt;div&gt;&lt;h4&gt;세트 구성&lt;/h4&gt;&lt;p&gt;KV(인지) + 캐릭터 클로즈업 제품컷(전환)을 한 세트로. KV 단독으로 전환 기대 금물.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h2&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--green)&quot;&gt;&lt;/span&gt;GO — 이렇게 (검증된 KV)&lt;/h2&gt;
&lt;p class=&quot;sect-sub&quot;&gt;반응·전환을 함께 잡은 실제 KV. 이 무드를 IP만 갈아끼워 확장.&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;&lt;figure class=&quot;go&quot;&gt;&lt;div class=&quot;iw&quot;&gt;&lt;img loading=&quot;lazy&quot; src=&quot;https://www.facebook.com/ads/image/?d=AQLCU05b6SWv33y7PY3g6oyIOSaC6yY65OkqS4yT6UltQq-wBwqr3j9So32dYRqGCYce60QLL2HD71q9Fruz-m12S6xGAEyrEMIjZriizDSh235eJQefJ_TDuDCALk13k26SUIL9y-ndfhEwYtsjesIj&quot; alt=&quot;&quot;&gt;&lt;/div&gt;
        &lt;figcaption&gt;&lt;div class=&quot;why&quot;&gt;여러 캐릭터 한 프레임 · 밝은 배경 · 케이스 또렷&lt;/div&gt;&lt;div class=&quot;mx&quot;&gt;전환 2.26% · ROAS 2.05&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;&lt;figure class=&quot;go&quot;&gt;&lt;div class=&quot;iw&quot;&gt;&lt;img loading=&quot;lazy&quot; src=&quot;https://www.facebook.com/ads/image/?d=AQJuUKHgHimURugD_8PnBVVGp6IkBO_B1uiYU2qKnIIj7JchYbGkNXIuWFmwkrxnuC2Arv3mZjZSfl7M7TJYdxKz-I6hIZiSMzAs6du_hU_8mm0vj9N22LHUoiXG5dxpbI1RFJMwqpxItgWpB0dVt3p2&quot; alt=&quot;&quot;&gt;&lt;/div&gt;
        &lt;figcaption&gt;&lt;div class=&quot;why&quot;&gt;IP 캐릭터 히어로 · 경쾌한 톤&lt;/div&gt;&lt;div class=&quot;mx&quot;&gt;전환 2.73% · ROAS 2.33&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;&lt;figure class=&quot;go&quot;&gt;&lt;div class=&quot;iw&quot;&gt;&lt;img loading=&quot;lazy&quot; src=&quot;https://www.facebook.com/ads/image/?d=AQKT6q--MHIf2dyjf7iCqYQwqySox-PMMN4eMInOVu3LULxAI7rIIbfVv_vkXWACMtCQyachhwGtb6k_VY6X4YSMx7URFut1_NGvXGWGtk-duNFdWuEo9_N-8A9rZh4dHlZdoNkKkoQX_U0emWoUsPBA&quot; alt=&quot;&quot;&gt;&lt;/div&gt;
        &lt;figcaption&gt;&lt;div class=&quot;why&quot;&gt;캐릭터 클로즈업 · 표정으로 즉시 인지&lt;/div&gt;&lt;div class=&quot;mx&quot;&gt;전환 2.66% · ROAS 2.12&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;&lt;figure class=&quot;go&quot;&gt;&lt;div class=&quot;iw&quot;&gt;&lt;img loading=&quot;lazy&quot; src=&quot;https://www.facebook.com/ads/image/?d=AQLMJGU2IzuV2K7vfwcf8Kn3ffgD7mOk3ry4VhC-NZBS1NUyHosgvmQNUM6OYl7fXLK70TdJr1wik5Voziup6zwD455ok5rqgLN4uXlb_G-aKFxmrpe8sga88rFQDnrZDxcuLvhfWV8zWdUGpzGLE4LZ&quot; alt=&quot;&quot;&gt;&lt;/div&gt;
        &lt;figcaption&gt;&lt;div class=&quot;why&quot;&gt;밈성 캐릭터 · 제품 선명&lt;/div&gt;&lt;div class=&quot;mx&quot;&gt;전환 1.85% · ROAS 1.78&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;&lt;figure class=&quot;go&quot;&gt;&lt;div class=&quot;iw&quot;&gt;&lt;img loading=&quot;lazy&quot; src=&quot;https://www.facebook.com/ads/image/?d=AQITdA6wl8xKToNifCxMGUVU6Tal8Sh55U7SKTXfdA10KTGwKNUKHCkN2UFwg_-6PDp1p2nG2ZzioErcO5qxTuodtzu-3FDIVhn5wUtEhQFry2ADtY0KrbbGQftSx_wrm2dSbBXQYf-NsqhI-FDOmMSJ&quot; alt=&quot;&quot;&gt;&lt;/div&gt;
        &lt;figcaption&gt;&lt;div class=&quot;why&quot;&gt;컬렉션 · 라인업 무드&lt;/div&gt;&lt;div class=&quot;mx&quot;&gt;전환 2.06% · ROAS 3.23&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;&lt;figure class=&quot;go&quot;&gt;&lt;div class=&quot;iw&quot;&gt;&lt;img loading=&quot;lazy&quot; src=&quot;https://yhbduxezupwfmcemuokt.supabase.co/storage/v1/object/public/board-img/b38.png&quot; alt=&quot;&quot;&gt;&lt;/div&gt;
        &lt;figcaption&gt;&lt;div class=&quot;why&quot;&gt;무지 라인 · 하이키 · 제품 주인공&lt;/div&gt;&lt;div class=&quot;mx&quot;&gt;전환 2.33% · CTR 5.16%&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;&lt;/div&gt;

&lt;h2&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--red)&quot;&gt;&lt;/span&gt;NO — 이렇게는 금지&lt;/h2&gt;
&lt;p class=&quot;sect-sub&quot;&gt;CTR(클릭)은 높아도 전환이 붕괴한 KV. 무드는 예쁘지만 안 팔림.&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;&lt;figure class=&quot;no&quot;&gt;&lt;div class=&quot;iw&quot;&gt;&lt;img loading=&quot;lazy&quot; src=&quot;https://yhbduxezupwfmcemuokt.supabase.co/storage/v1/object/public/board-img/b61.png&quot; alt=&quot;&quot;&gt;&lt;/div&gt;
        &lt;figcaption&gt;&lt;div class=&quot;why&quot;&gt;패턴이 화면을 꽉 채워 제품이 안 보임&lt;/div&gt;&lt;div class=&quot;mx&quot;&gt;CTR 4.98% 인데 전환 0.09% 붕괴&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;&lt;figure class=&quot;no&quot;&gt;&lt;div class=&quot;iw&quot;&gt;&lt;img loading=&quot;lazy&quot; src=&quot;https://yhbduxezupwfmcemuokt.supabase.co/storage/v1/object/public/board-img/b60.png&quot; alt=&quot;&quot;&gt;&lt;/div&gt;
        &lt;figcaption&gt;&lt;div class=&quot;why&quot;&gt;패턴 월페이퍼 · 케이스 뭉개짐&lt;/div&gt;&lt;div class=&quot;mx&quot;&gt;CTR 3.92% / 전환 0.15%&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;&lt;figure class=&quot;no&quot;&gt;&lt;div class=&quot;iw&quot;&gt;&lt;img loading=&quot;lazy&quot; src=&quot;https://yhbduxezupwfmcemuokt.supabase.co/storage/v1/object/public/board-img/b10.jpg&quot; alt=&quot;&quot;&gt;&lt;/div&gt;
        &lt;figcaption&gt;&lt;div class=&quot;why&quot;&gt;무드는 있으나 케이스 인지 어려움(패션/추상)&lt;/div&gt;&lt;div class=&quot;mx&quot;&gt;CTR 4.47% / 전환 0.23%&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;&lt;/div&gt;
&lt;div class=&quot;rules&quot; style=&quot;margin-top:14px&quot;&gt;
 &lt;div class=&quot;rule bad&quot;&gt;&lt;div class=&quot;n&quot;&gt;✕&lt;/div&gt;&lt;div&gt;&lt;h4&gt;패턴 월페이퍼&lt;/h4&gt;&lt;p&gt;패턴이 화면을 꽉 채워 케이스·제품이 뭉개짐 (전환 0.1%대).&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;rule bad&quot;&gt;&lt;div class=&quot;n&quot;&gt;✕&lt;/div&gt;&lt;div&gt;&lt;h4&gt;사람 모델·라이프스타일&lt;/h4&gt;&lt;p&gt;인물/착용 라이프스타일 컷. PRSM 패션·시딩 참패(ROAS 0.14~0.33).&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;rule bad&quot;&gt;&lt;div class=&quot;n&quot;&gt;✕&lt;/div&gt;&lt;div&gt;&lt;h4&gt;잡지·에디토리얼 추상&lt;/h4&gt;&lt;p&gt;무드만 있고 케이스인지 알 수 없는 감성/추상 구성.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;rule bad&quot;&gt;&lt;div class=&quot;n&quot;&gt;✕&lt;/div&gt;&lt;div&gt;&lt;h4&gt;어둡고 무거운 톤·카피 과다&lt;/h4&gt;&lt;p&gt;다크 무드, 텍스트·프로모 카피 남발.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;oneliner&quot;&gt;&quot;캐릭터가 주인공, 케이스가 또렷하게, 밝고 경쾌하게. 패턴 벽지와 패션·에디토리얼 컷은 금지.&quot;&lt;/div&gt;

&lt;h2&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--blue)&quot;&gt;&lt;/span&gt;제출 스펙 (체크리스트)&lt;/h2&gt;
&lt;div class=&quot;spec&quot;&gt;
 &lt;div&gt;&lt;b&gt;비율&lt;/b&gt; 1:1(피드)·4:5(모바일) 필수, 필요시 9:16(스토리). IP당 히어로 1점 + 컬렉션 1점 권장.&lt;/div&gt;
 &lt;div&gt;&lt;b&gt;세이프존&lt;/b&gt; 상·하단 UI(장바구니·CTA·자막) 겹침 고려, 핵심 요소는 중앙.&lt;/div&gt;
 &lt;div&gt;&lt;b&gt;제품 인지&lt;/b&gt; 폰 화면 내 케이스가 한눈에 케이스로 읽히게(오브제 60% 이상 노출).&lt;/div&gt;
 &lt;div&gt;&lt;b&gt;텍스트&lt;/b&gt; 있으면 크게 1줄. 프로모 카피는 별도 오퍼 소재로 분리.&lt;/div&gt;
 &lt;div&gt;&lt;b&gt;배경&lt;/b&gt; 하이키·단색/파스텔로 제품 대비 확보. 패턴은 배경 보조로만, 전면 금지.&lt;/div&gt;
 &lt;div&gt;&lt;b&gt;세트&lt;/b&gt; KV와 함께 캐릭터 클로즈업 제품컷 1~2점 동반 제출(전환용).&lt;/div&gt;
&lt;/div&gt;

&lt;h1&gt;KV 스토리보드 — 밝은 무드&lt;/h1&gt;
&lt;p class=&quot;lead&quot;&gt;신제품 라인 KV 컷 구성안. 하이키·파스텔·캐릭터 히어로·제품 가독성 원칙 기반.&lt;/p&gt;
&lt;p class=&quot;meta&quot;&gt;※ 실사진이 아닌 구성/무드 목업(레이아웃 스케치). 색·캐릭터는 IP에 맞춰 대체. 디자인팀 방향 참고용.&lt;/p&gt;
&lt;div class=&quot;strip&quot;&gt;&lt;b&gt;공통 무드.&lt;/b&gt; 배경은 화이트/파스텔 하이키, 캐릭터가 크고 또렷한 주인공, 케이스(투명)가 폰에 씌워진 실물로 선명. 텍스트 최소, 1초 안에 IP+케이스 인지. 어두운 톤·패턴 월페이퍼·사람 모델 금지.&lt;/div&gt;
