name: Publish site (main -> gh-pages)

# GitHub Pages 소스가 gh-pages 브랜치 /root 로 잡혀 있다.
# main 에 push 하면 이 워크플로가 main 내용을 gh-pages 로 그대로 옮기고,
# GitHub의 기본 "pages build and deployment"가 이어서 배포한다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main tree to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push --force origin HEAD:refs/heads/gh-pages
