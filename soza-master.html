&lt;div class=&quot;kicker&quot;&gt;SLBS · iPhone 18 Creative Brief&lt;/div&gt;
&lt;h1&gt;아이폰18 광고 소재 브리프&lt;/h1&gt;
&lt;p class=&quot;lead&quot;&gt;아이폰17 실판매·광고 데이터에서 검증된 소재 전략. &quot;무엇을 만들고, 무엇을 밀고, 무엇을 버릴지&quot;의 한 장 정리.&lt;/p&gt;
&lt;p class=&quot;meta&quot;&gt;근거: 아이폰17 canonical 실판매 + 메타 전 소재(맷블랙/갤럭시 제외) · PRSM/모노클리어 콘텐츠 보드 · 자사몰·스스 MER&lt;/p&gt;

&lt;div class=&quot;tl&quot;&gt;&lt;b&gt;한 줄 결론.&lt;/b&gt; 반응(클릭)과 성과(구매)는 다르다. &lt;b&gt;제품·캐릭터 클로즈업컷&lt;/b&gt;이 팔고, &lt;b&gt;패턴 전면 KV·에디토리얼·시딩&lt;/b&gt;은 클릭만 받고 안 판다. 아이폰18은 산리오 핵심 IP의 클로즈업컷을 전환 주력으로 깔고, 화려한 비주얼은 인지용으로만, 예산은 소재 자기보고 ROAS가 아니라 &lt;b&gt;실판매 MER&lt;/b&gt;로 관리한다.&lt;/div&gt;

&lt;h2&gt;1. 핵심 원칙 5&lt;/h2&gt;
&lt;div class=&quot;principles&quot;&gt;
&lt;div class=&quot;pr&quot;&gt;&lt;div class=&quot;n&quot; style=&quot;background:#0ca30c&quot;&gt;1&lt;/div&gt;&lt;div&gt;&lt;h4&gt;제품·캐릭터 클로즈업 = 전환 주력&lt;/h4&gt;&lt;p&gt;제품컷·오브제가 전 유형 중 전환 효율 최고. PRSM 제품컷 ROAS 1.6~3.0, 모노클리어 캐릭터 착용/클로즈업컷(아이폰17산리오_키티 전환 1.81, 산리오_키티KV 2.73)이 실제 구매를 만든다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;pr&quot;&gt;&lt;div class=&quot;n&quot; style=&quot;background:#eb6834&quot;&gt;2&lt;/div&gt;&lt;div&gt;&lt;h4&gt;패턴 전면 KV = 인지·후킹 전용 (전환 기대 금물)&lt;/h4&gt;&lt;p&gt;패턴을 꽉 채운 키비주얼은 CTR 최상위(헬로키티패턴_KV 4.98%·포차코패턴_KV 3.92%)지만 전환율 0.1%대로 붕괴. 클릭 함정. 상단 노출·인지 목적에만 소량 배치.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;pr&quot;&gt;&lt;div class=&quot;n&quot; style=&quot;background:#d03b3b&quot;&gt;3&lt;/div&gt;&lt;div&gt;&lt;h4&gt;매거진·시딩·에디토리얼 = 판매 캠페인에서 제외&lt;/h4&gt;&lt;p&gt;인플루언서/에디토리얼 콘텐츠는 전 유형 최하(ROAS 1.44·전환 1.19). PRSM 메거진·시딩은 ROAS 0.14~0.33 참패. 화제성·인지 예산으로만 분리, 전환 캠페인에서 뺀다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;pr&quot;&gt;&lt;div class=&quot;n&quot; style=&quot;background:#2a78d6&quot;&gt;4&lt;/div&gt;&lt;div&gt;&lt;h4&gt;ASC(어드벤티지+) 자동화 예산 유지&lt;/h4&gt;&lt;p&gt;전체상품 어드벤티지(ASC) 단일 소재가 ROAS 2.04로 효율 주역. 신제품 초기 카탈로그 자동화 예산은 기본으로 깔고 간다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;pr&quot;&gt;&lt;div class=&quot;n&quot; style=&quot;background:#64748b&quot;&gt;5&lt;/div&gt;&lt;div&gt;&lt;h4&gt;판단은 소재 ROAS가 아니라 실판매 MER로&lt;/h4&gt;&lt;p&gt;소재→자사몰 주문 연결키(utm_content)가 없어 소재별 실판매 귀속은 불가. 소재 숫자는 방향, 금액·증액 판단은 자사몰 실판매 MER(대개 2.0~3.0)로. 밀수록 MER이 떨어지면 과투자 신호.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h2&gt;2. IP 우선순위 (아이폰17 모노클리어 실판매 8,211개 기준)&lt;/h2&gt;
&lt;table&gt;

&lt;tr&gt;&lt;td&gt;&lt;b&gt;쿠로미&lt;/b&gt;(패턴+LOVE)&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;817&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;9.9%&lt;/td&gt;&lt;td&gt;캐릭터 클로즈업. LOVE 등 서브테마 유지&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;한교동&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;880&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;10.7%&lt;/td&gt;&lt;td&gt;캐릭터KV 효율 양호(산리오_한교동KV 전환 2.66). 증량 여지&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;포차코&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;783&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;9.5%&lt;/td&gt;&lt;td&gt;착용·클로즈업컷. &lt;span class=&quot;tag r_&quot;&gt;패턴 전면KV 지양&lt;/span&gt;(전환 0.15)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;메타몽&lt;/b&gt;(포켓몬)&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;512&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;6.2%&lt;/td&gt;&lt;td&gt;제품컷/KV 모두 전환 양호(메타몽_KV 1.85). 밈성 강점&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;마이멜로디&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;470&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;5.7%&lt;/td&gt;&lt;td&gt;캐릭터 클로즈업. 저지출로도 전환 확보&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;폼폼푸린&lt;/b&gt;(패턴+굿즈)&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;377&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;4.6%&lt;/td&gt;&lt;td&gt;클로즈업 중심. 소재 다양화보다 검증컷 집중&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;시나모롤&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;296&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;3.6%&lt;/td&gt;&lt;td&gt;캐릭터컷 유지&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;포켓몬(피카츄·꼬부기·잉어킹)&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;350&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;4.3%&lt;/td&gt;&lt;td&gt;인덱스·네임택 디자인. 제품컷 위주&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;베베더오리&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;311&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;3.8%&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag r_&quot;&gt;소재 물량 축소&lt;/span&gt;. 소재 13개 최다 투자 대비 판매 얕음. 검증 후킹영상 소수만&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;산리오 단체·1+1&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;—&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;—&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag g&quot;&gt;최고효율·증량&lt;/span&gt; ROAS 2.0~3.9. 번들·단체 비주얼 확대&lt;/td&gt;&lt;/tr&gt;

&lt;h2&gt;3. 소재 유형별 효율 (메타 자기보고 · 맷블랙 제외 396개)&lt;/h2&gt;

&lt;tr&gt;&lt;td&gt;제품컷·오브제&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1.86&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;2.58%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1.41%&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag g&quot;&gt;전환 주력&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;기타·IP·브로드(ASC)&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;2.04&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;2.90%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1.74%&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag b&quot;&gt;예산 유지&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;오퍼·프로모션&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1.71&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;2.69%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1.94%&lt;/td&gt;&lt;td&gt;할인기 활용·남발 주의&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;KV·키비주얼&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1.63&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;3.23%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1.33%&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag o&quot;&gt;인지·후킹 전용&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;에디토리얼·컨텐츠·시딩&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1.44&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;2.65%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1.19%&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag r_&quot;&gt;전환 캠페인 제외&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;

&lt;h2&gt;4. 밀 것 vs 버릴 것&lt;/h2&gt;
&lt;div class=&quot;cols2&quot;&gt;
&lt;div class=&quot;card win&quot;&gt;&lt;h3&gt;✅ 스케일 (계속·증량)&lt;/h3&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;산리오 단체·1+1&lt;/b&gt; KV/이미지 — 최고 ROAS(2.0~3.9)&lt;/li&gt;
&lt;li&gt;&lt;b&gt;캐릭터 클로즈업 KV&lt;/b&gt; — 산리오_키티KV(전환 2.73)·한교동KV(2.66)&lt;/li&gt;
&lt;li&gt;&lt;b&gt;메타몽 KV/제품컷&lt;/b&gt; — 전환·밈성 동시&lt;/li&gt;
&lt;li&gt;&lt;b&gt;PRSM 제품컷&lt;/b&gt; — 09·11·12 (ROAS 1.6~3.0, 오브제컷)&lt;/li&gt;
&lt;li&gt;&lt;b&gt;PRSM KV ads01·ads06·ads02&lt;/b&gt; — 반응·전환 동시 충족&lt;/li&gt;
&lt;li&gt;&lt;b&gt;모노라인클리어 KV&lt;/b&gt;(무지) — CTR·전환 양호&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card kill&quot;&gt;&lt;h3&gt;⛔ 폐기·재작업&lt;/h3&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;패턴 전면 KV컷&lt;/b&gt; — 헬로키티패턴·포차코패턴·쿠로미패턴 KV (전환 0.1%대 붕괴)&lt;/li&gt;
&lt;li&gt;&lt;b&gt;PRSM 메거진·시딩(인플루언서)&lt;/b&gt; — ROAS 0.14~0.33&lt;/li&gt;
&lt;li&gt;&lt;b&gt;베베더오리 소재 과투자&lt;/b&gt; — 13개→검증컷 소수로 축소&lt;/li&gt;
&lt;li&gt;&lt;b&gt;저성과 영상&lt;/b&gt; — 토이스토리5 KV영상 등 전환 0%대&lt;/li&gt;
&lt;li&gt;&lt;b&gt;클리어런스·구모델 오퍼&lt;/b&gt; — ROAS 0.4~0.9 다수&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h2&gt;5. 권장 소재 예시 (영구 링크 · 실제 집행 소재)&lt;/h2&gt;
&lt;p&gt;아이폰18 제작 레퍼런스 — 아래 유형을 IP만 갈아끼워 확장.&lt;/p&gt;
&lt;div class=&quot;strip&quot;&gt;
&lt;figure class=&quot;good&quot;&gt;&lt;div class=&quot;iw&quot;&gt;&lt;img loading=&quot;lazy&quot; src=&quot;https://www.facebook.com/ads/image/?d=AQLCU05b6SWv33y7PY3g6oyIOSaC6yY65OkqS4yT6UltQq-wBwqr3j9So32dYRqGCYce60QLL2HD71q9Fruz-m12S6xGAEyrEMIjZriizDSh235eJQefJ_TDuDCALk13k26SUIL9y-ndfhEwYtsjesIj&quot;&gt;&lt;/div&gt;&lt;figcaption&gt;&lt;b&gt;산리오 단체KV&lt;/b&gt;&lt;span class=&quot;m&quot;&gt;ROAS 2.05 · 전환 2.26%&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;
&lt;figure class=&quot;good&quot;&gt;&lt;div class=&quot;iw&quot;&gt;&lt;img loading=&quot;lazy&quot; src=&quot;https://www.facebook.com/ads/image/?d=AQJuUKHgHimURugD_8PnBVVGp6IkBO_B1uiYU2qKnIIj7JchYbGkNXIuWFmwkrxnuC2Arv3mZjZSfl7M7TJYdxKz-I6hIZiSMzAs6du_hU_8mm0vj9N22LHUoiXG5dxpbI1RFJMwqpxItgWpB0dVt3p2&quot;&gt;&lt;/div&gt;&lt;figcaption&gt;&lt;b&gt;키티 캐릭터KV&lt;/b&gt;&lt;span class=&quot;m&quot;&gt;ROAS 2.33 · 전환 2.73%&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;
&lt;figure class=&quot;good&quot;&gt;&lt;div class=&quot;iw&quot;&gt;&lt;img loading=&quot;lazy&quot; src=&quot;https://www.facebook.com/ads/image/?d=AQKT6q--MHIf2dyjf7iCqYQwqySox-PMMN4eMInOVu3LULxAI7rIIbfVv_vkXWACMtCQyachhwGtb6k_VY6X4YSMx7URFut1_NGvXGWGtk-duNFdWuEo9_N-8A9rZh4dHlZdoNkKkoQX_U0emWoUsPBA&quot;&gt;&lt;/div&gt;&lt;figcaption&gt;&lt;b&gt;한교동 캐릭터KV&lt;/b&gt;&lt;span class=&quot;m&quot;&gt;ROAS 2.12 · 전환 2.66%&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;
&lt;figure class=&quot;good&quot;&gt;&lt;div class=&quot;iw&quot;&gt;&lt;img loading=&quot;lazy&quot; src=&quot;https://www.facebook.com/ads/image/?d=AQLMJGU2IzuV2K7vfwcf8Kn3ffgD7mOk3ry4VhC-NZBS1NUyHosgvmQNUM6OYl7fXLK70TdJr1wik5Voziup6zwD455ok5rqgLN4uXlb_G-aKFxmrpe8sga88rFQDnrZDxcuLvhfWV8zWdUGpzGLE4LZ&quot;&gt;&lt;/div&gt;&lt;figcaption&gt;&lt;b&gt;메타몽 KV&lt;/b&gt;&lt;span class=&quot;m&quot;&gt;ROAS 1.78 · 전환 1.85%&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;
&lt;figure class=&quot;good&quot;&gt;&lt;div class=&quot;iw&quot;&gt;&lt;img loading=&quot;lazy&quot; src=&quot;https://www.facebook.com/ads/image/?d=AQITdA6wl8xKToNifCxMGUVU6Tal8Sh55U7SKTXfdA10KTGwKNUKHCkN2UFwg_-6PDp1p2nG2ZzioErcO5qxTuodtzu-3FDIVhn5wUtEhQFry2ADtY0KrbbGQftSx_wrm2dSbBXQYf-NsqhI-FDOmMSJ&quot;&gt;&lt;/div&gt;&lt;figcaption&gt;&lt;b&gt;산리오 1+1 이미지&lt;/b&gt;&lt;span class=&quot;m&quot;&gt;ROAS 3.23 · 전환 2.06%&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;
&lt;figure class=&quot;good&quot;&gt;&lt;div class=&quot;iw&quot;&gt;&lt;img loading=&quot;lazy&quot; src=&quot;https://www.facebook.com/ads/image/?d=AQKvhiUWh3KOqFw6S4Z4qZ5vl5OUhUGtIGyslaK59mlurwvL0ZHZkjWA3OZLJCedkdGjBGInAQ1wnSERkCywXCY6sLwnZRi8CHTl5Npt2x6sjRqKq1LO-EaxtY8NWHvw9e5RIzSWw-2xeJNc-9GsuHpU&quot;&gt;&lt;/div&gt;&lt;figcaption&gt;&lt;b&gt;PRSM 제품컷(오브제)&lt;/b&gt;&lt;span class=&quot;m&quot;&gt;ROAS 3.04 · 전환 2.51%&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;
&lt;/div&gt;

&lt;h2&gt;6. 실행 체크리스트&lt;/h2&gt;
&lt;div class=&quot;checklist&quot;&gt;
&lt;div&gt;&lt;b&gt;01 · IP 물량&lt;/b&gt; 산리오(특히 헬로키티) 중심 배분, 판매 실적 순으로 소재 수량 배정. 베베더오리·신규IP는 최소 테스트.&lt;/div&gt;
&lt;div&gt;&lt;b&gt;02 · 소재 구성&lt;/b&gt; IP당 ①캐릭터 클로즈업(전환) ②단체/1+1(효율) 기본, 패턴 전면KV는 인지용 1점만.&lt;/div&gt;
&lt;div&gt;&lt;b&gt;03 · 캠페인 분리&lt;/b&gt; 전환 캠페인 = 제품·캐릭터컷 / 인지 캠페인 = KV·시딩. 시딩을 전환에 섞지 않는다.&lt;/div&gt;
&lt;div&gt;&lt;b&gt;04 · ASC&lt;/b&gt; 어드벤티지+ 카탈로그 예산을 출시 초기부터 상시 배치.&lt;/div&gt;
&lt;div&gt;&lt;b&gt;05 · 측정&lt;/b&gt; 주간 자사몰 실판매 MER로 증액/감액 결정. 소재 자기보고 ROAS는 방향 참고만.&lt;/div&gt;
&lt;div&gt;&lt;b&gt;06 · PRSM&lt;/b&gt; 오브제 제품컷 주력 + KV 후킹 소량. 시딩·메거진 제외. 실MER 낮으니 과투자 경계.&lt;/div&gt;
&lt;div&gt;&lt;b&gt;07 · Day-1 준비&lt;/b&gt; 신규 디자인 완성 마감(8/21) 엄수 — 검증된 캐릭터 클로즈업 포맷으로 즉시 확장.&lt;/div&gt;
&lt;/div&gt;

&lt;p class=&quot;foot&quot;&gt;지표 주의: CTR·CVR·ROAS는 메타 자기보고(픽셀 귀속)로, 소액 소재일수록 노이즈가 크다. 실판매·MER은 canonical(전 채널·태그제외, sales_raw+realtime_orders 결합)로 산출했으며 GA4 검증 자사몰 실주문 포착률은 약 76%. PRSM은 별도 프리미엄 폼팩터로 모노클리어 합계에서 분리했다. 이미지는 만료 없는 영구 permalink.&lt;/p&gt;

ot;color:#8a8880&quot;&gt;폐기 후보&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td class=&quot;nm&quot;&gt;PRSM_KV ads05&lt;/td&gt;&lt;td&gt;81,431&lt;/td&gt;&lt;td&gt;2.57%&lt;/td&gt;&lt;td&gt;1.42%&lt;/td&gt;&lt;td&gt;&lt;b&gt;1.93&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;nc&quot;&gt;3&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;cf&quot; style=&quot;color:#d03b3b&quot;&gt;노이즈 주의&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;qb&quot; style=&quot;color:#2a78d6&quot;&gt;숨은 일꾼&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td class=&quot;nm&quot;&gt;PRSM_KV01&lt;/td&gt;&lt;td&gt;69,485&lt;/td&gt;&lt;td&gt;6.1%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;b&gt;—&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;nc&quot;&gt;0&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;cf&quot; style=&quot;color:#8a8880&quot;&gt;데이터없음&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;qb&quot; style=&quot;color:#d03b3b&quot;&gt;화제성뿐&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td class=&quot;nm&quot;&gt;PRSM_KV02&lt;/td&gt;&lt;td&gt;53,395&lt;/td&gt;&lt;td&gt;2.41%&lt;/td&gt;&lt;td&gt;0.7%&lt;/td&gt;&lt;td&gt;&lt;b&gt;0.01&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;nc&quot;&gt;1&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;cf&quot; style=&quot;color:#d03b3b&quot;&gt;노이즈 주의&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;qb&quot; style=&quot;color:#8a8880&quot;&gt;폐기 후보&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;kvnote&quot;&gt;&lt;div class=&quot;kvcard&quot;&gt;&lt;b style=&quot;color:#0ca30c&quot;&gt;① 진짜 신호(전환 40건+)&lt;/b&gt;&lt;br&gt;CTR과 ROAS가 &lt;b&gt;따로 논다&lt;/b&gt;. KV04는 CTR 4.47%로 클릭 1등인데 ROAS 0.63으로 최악(안 삼). 반대로 KV08은 CTR 평범해도 ROAS 3.42로 돈값 최고. “후킹 세다 ≠ 잘 판다”가 KV 안에서 그대로 증명.&lt;/div&gt;&lt;div class=&quot;kvcard&quot;&gt;&lt;b style=&quot;color:#d03b3b&quot;&gt;② 소액 노이즈(전환 20건 이하)&lt;/b&gt;&lt;br&gt;KV ads07의 ROAS 8.98은 전환 23건짜리 착시 — 한두 건에 몇 배로 요동. KV02(0.01·1건)도 동일. &lt;b&gt;이 숫자를 효율로 읽으면 안 됨.&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kvcard&quot;&gt;&lt;b style=&quot;color:#2a78d6&quot;&gt;③ 이름 ≠ 실제 이미지&lt;/b&gt;&lt;br&gt;일부 소재는 다른 이름인데 &lt;b&gt;같은 image_hash(같은 그림)&lt;/b&gt;. “KV”라는 이름 묶음이 실제 이미지 단위가 아님. 정확한 규명은 image_hash·utm_content 단위라야 가능.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

&lt;div class=&quot;insight&quot;&gt;
 &lt;b&gt;PRSM은 반응과 성과가 어긋납니다.&lt;/b&gt; 반응(CTR) 최상위는 &lt;b&gt;메거진·시딩(인플루언서)&lt;/b&gt;과 일부 KV(시딩09 7.59%·KV01 6.10%)인데, 우하단 &#x27;화제성뿐&#x27; — 클릭은 폭발해도 전환은 0에 수렴합니다(메거진 전환율 0.13%·ROAS 0.46). 실제로 파는 건 좌·상단의 &lt;b&gt;제품컷&lt;/b&gt;(전환 상위 02·09·10·14·11). 우상단 &#x27;끌리고 팔림&#x27;(반응·전환 동시 충족)은 &lt;b&gt;KV ads01·KV ads06·KV ads02·제품컷11&lt;/b&gt; 소수입니다.
 &lt;br&gt;&lt;br&gt;&lt;b&gt;아이폰18:&lt;/b&gt; 제품컷을 전환 주력으로, 반응 좋은 KV는 상단 후킹 소량, 메거진·시딩은 판매 캠페인에서 덜어내거나 인지 예산으로만. 시딩의 높은 CTR에 속아 판매를 기대하지 말 것.
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;지표는 메타 자기보고(CTR 직접측정 신뢰↑, 전환·ROAS는 픽셀 귀속이라 소액일수록 노이즈). PRSM 전체 실매출 MER은 별도 분석 1.2~1.6(회사평균 하회). 지출≥5만원·이미지 확보 상위 35개.&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;insight&quot;&gt;
 &lt;b&gt;PRSM과 같은 교훈이 IP에서도 반복됩니다.&lt;/b&gt; &lt;b&gt;패턴 전면 KV컷&lt;/b&gt;(헬로키티패턴_KV·포차코패턴_KV·쿠로미패턴_KV)은 CTR 3.5~5%로 시선은 끌지만 전환율이 0.1%대로 붕괴 — 우하단 &#x27;화제성뿐&#x27;. 반대로 &lt;b&gt;제품 착용/캐릭터 클로즈업&lt;/b&gt;(아이폰17산리오_키티·산리오_키티KV·메타몽_KV)이 전환을 만듭니다.
 &lt;br&gt;&lt;br&gt;&lt;b&gt;IP별:&lt;/b&gt; 산리오 단체·1+1이 ROAS 2.0~3.9로 최고, 메타몽 강세. &lt;b&gt;헬로키티는 판매 1위지만 소재 효율은 중간&lt;/b&gt;(대표 패턴KV 전환 0.09) — 판매는 IP파워·오가닉에서 나옴. &lt;b&gt;베베더오리는 소재 13개로 최다 투자인데 판매는 3.8%뿐&lt;/b&gt; — 후킹/영상 일부만 반응, IP 수요가 얕아 소재 과투자. 아이폰18은 산리오 핵심 IP의 &#x27;캐릭터 클로즈업&#x27; 중심으로, 패턴 전면컷은 인지용으로만.
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;지표는 메타 자기보고(CTR 직접측정 신뢰↑, 전환·ROAS는 픽셀 귀속이라 소액일수록 노이즈). 갤럭시(B7/S26 등)·PRSM·클리어런스·비IP 소재 제외. iPhone 모노클리어 관련 소재 지출≥5만원 43개. 기준선 CTR 2.5%·전환 1.8%.&lt;/p&gt;

<script>
const ov=document.getElementById('ov');

  const t=document.getElementById('mtag');t.textContent=d.type||'';t.style.background=d.tc||'#888';
  const q=document.getElementById('mquad');q.textContent=d.quad||'';q.style.color=d.qc||'#888';
  document.getElementById('mnm').textContent=d.nm||'';
  document.getElementById('ms').textContent=(d.s||'')+'원';
  document.getElementById('mctr').textContent=(d.ctr||'')+'%';
  document.getElementById('mcvr').textContent=(d.cvr&&d.cvr!=='—'?d.cvr+'%':'—');
